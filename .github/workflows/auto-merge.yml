name: Auto-merge approved pull requests

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable auto-merge after maintainer approval
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify that the reviewer is a maintainer
        id: reviewer
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const reviewer = context.payload.review.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: reviewer,
            });

            const allowedPermissions = new Set(['admin', 'maintain', 'write']);
            const allowed = allowedPermissions.has(data.permission);
            core.setOutput('allowed', allowed ? 'true' : 'false');

            if (!allowed) {
              core.notice(`@${reviewer} does not have maintainer-level merge permission.`);
            }

      - name: Squash and merge when all requirements pass
        if: steps.reviewer.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --squash
          --auto
          --match-head-commit "$REVIEWED_HEAD_SHA"
