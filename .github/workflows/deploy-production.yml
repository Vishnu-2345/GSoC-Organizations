name: Weekly production deployment

on:
  schedule:
    # Sundays at 09:00 Asia/Kolkata (03:30 UTC).
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and deploy main
    if: github.repository == 'rohanmalhotracodes/GSoC-Organizations'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 6902f78dd6771a26c1222881e76accae
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.11
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production data
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: Build the production site
        run: npm run build

      - name: Record the deployed commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        env:
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: >-
          npx wrangler pages deploy dist
          --project-name gsoc-organizations
          --branch main
          --commit-hash "$DEPLOY_SHA"
          --commit-message "Weekly production deployment from main"
