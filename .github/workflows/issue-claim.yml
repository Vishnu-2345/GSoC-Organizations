name: Issue claims

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-claims
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      !github.event.issue.pull_request &&
      (github.event.comment.body == '/claim' || github.event.comment.body == '/unclaim')
    runs-on: ubuntu-latest
    steps:
      - name: Process issue claim
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const contributor = context.actor;
            const command = context.payload.comment.body.trim();
            const maxActiveClaims = 2;

            const reply = (body) => github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

            const { data: currentIssue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issue.number,
            });

            if (command === '/unclaim') {
              if (!currentIssue.assignees.some(({ login }) => login === contributor)) {
                await reply(`@${contributor}, this issue is not assigned to you.`);
                return;
              }
              await github.rest.issues.removeAssignees({
                owner,
                repo,
                issue_number: issue.number,
                assignees: [contributor],
              });
              if (currentIssue.assignees.length === 1) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issue.number,
                    name: 'in progress',
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              await reply(`✅ @${contributor} released this issue for another contributor.`);
              return;
            }

            if (currentIssue.state !== 'open') {
              await reply(`@${contributor}, closed issues cannot be claimed.`);
              return;
            }
            if (currentIssue.assignees.some(({ login }) => login === contributor)) {
              await reply(`@${contributor}, this issue is already assigned to you.`);
              return;
            }
            if (currentIssue.assignees.length > 0) {
              await reply(`Sorry @${contributor}, this issue is already assigned.`);
              return;
            }

            const assignedItems = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              assignee: contributor,
              per_page: 100,
            });
            const activeClaims = assignedItems.filter(({ pull_request: pullRequest }) => !pullRequest);

            if (activeClaims.length >= maxActiveClaims) {
              const claimedIssues = activeClaims
                .map(({ number }) => `#${number}`)
                .join(', ');
              await reply(`@${contributor}, you already have the maximum of ${maxActiveClaims} active issue assignments (${claimedIssues}). Finish or \`/unclaim\` one before claiming another.`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issue.number,
                assignees: [contributor],
              });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['in progress'],
              });
              const newClaimCount = activeClaims.length + 1;
              await reply(`✅ Assigned to @${contributor}. You now have ${newClaimCount} of ${maxActiveClaims} allowed active issue assignments. Please keep the issue updated and use \`/unclaim\` if you can no longer work on it.`);
            } catch (error) {
              if (error.status !== 422) throw error;
              await reply(`@${contributor}, GitHub could not assign this issue automatically. A maintainer will need to assign it manually.`);
            }
