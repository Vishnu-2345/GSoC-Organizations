name: Collaborator application
description: Apply for the moderation stage after five meaningful merged pull requests.
title: '[Collaborator application]: '
labels: ['collaborator application']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for investing in GSoC Organizations. Five meaningful merged pull requests make you eligible to apply for the moderation stage; they do not grant repository or write access. Applications are approved only after maintainer review. Write access is a separate request requiring explicit Project Owner approval.

        Because this repository is currently owned by a personal GitHub account, GitHub cannot grant a close-only Triage role. Approved moderation collaborators will not receive broad write access merely to close issues or pull requests.

  - type: input
    id: github
    attributes:
      label: GitHub username
      placeholder: '@username'
    validations:
      required: true

  - type: textarea
    id: contributions
    attributes:
      label: Merged contributions
      description: Link at least five merged pull requests and briefly state what each improved.
      placeholder: |
        - #123 — verified the repository link for Example Organization
        - #124 — fixed mobile filter behavior
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why do you want to collaborate?
      description: Describe the area you want to maintain and how you plan to help contributors.
    validations:
      required: true

  - type: textarea
    id: review
    attributes:
      label: Review experience
      description: Link any useful issue triage, pull-request reviews, or contributor support you have already provided.
    validations:
      required: true

  - type: textarea
    id: moderation
    attributes:
      label: Moderation approach
      description: Explain when you would close a pull request, when you would request changes instead, and when you would escalate to the Project Owner.
    validations:
      required: true

  - type: checkboxes
    id: commitments
    attributes:
      label: Commitments
      options:
        - label: I have read and agree to follow `CONTRIBUTING.md` and the collaborator program.
          required: true
        - label: I understand that eligibility does not guarantee access and that access may be removed if responsibilities are not met.
          required: true
        - label: I understand that this application is for moderation responsibility only and does not grant write or merge access.
          required: true
        - label: I will always explain closures, avoid closing valid work prematurely, and escalate uncertain cases.
          required: true
        - label: I understand that write access requires a separate request and explicit Project Owner approval.
          required: true
        - label: I will protect contributor data, repository credentials, and the integrity of the curated dataset.
          required: true
